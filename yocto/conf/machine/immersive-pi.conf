# Immersive 360 node machine — Raspberry Pi 4 (64-bit).
#
# One image serves both roles (render | control); the role is read at boot from
# immersive.conf on the boot FAT. Pi 4 is the render board because it keeps the
# H.264 hardware decoder (v4l2h264dec) for 12 always-on nodes; the control node
# runs the same image and renders no video.
require conf/machine/raspberrypi4-64.conf

# Full KMS (vc4-kms-v3d) — the render stage drives DRM/KMS/GBM directly, no
# compositor. fkms is not enough for headless GLES2-over-GBM.
VC4DTBO = "vc4-kms-v3d"

# HDMI always live so a projector that is slow to handshake still gets a signal.
HDMI_FORCE_HOTPLUG = "1"

# Match the deployed fleet: contiguous memory for decode-ahead and GBM buffers.
# gpu_mem is firmware memory; it does not configure the Linux CMA allocator.
GPU_MEM = "256"
CMDLINE_CMA = "cma=512M"

# Appliance: no on-screen serial console, no rainbow splash, silent boot.
SERIAL_CONSOLES = ""
DISABLE_SPLASH = "1"
ENABLE_UART = "1"
DISABLE_OVERSCAN = "1"

BOOTDD_VOLUME_ID = "boot"
SDIMG_VFAT_LABEL = "boot"

# Preserve the PoE HAT cooling configuration used by the Dortmund fleet.
# The standard HAT overlay is already in meta-raspberrypi's boot overlay list.
# Set IMMERSIVE_POE_OVERLAY="rpi-poe-plus" for an official PoE+ HAT build.
IMMERSIVE_POE_OVERLAY ?= "rpi-poe"
RPI_KERNEL_DEVICETREE_OVERLAYS:append = "${@' overlays/rpi-poe-plus.dtbo' if d.getVar('IMMERSIVE_POE_OVERLAY') == 'rpi-poe-plus' else ''}"
RPI_EXTRA_CONFIG:append = "\n# PoE HAT cooling: low-speed airflow, full speed at 55 C\ndtoverlay=${IMMERSIVE_POE_OVERLAY}\ndtparam=poe_fan_temp0=1000,poe_fan_temp0_hyst=500\ndtparam=poe_fan_temp1=2000,poe_fan_temp1_hyst=500\ndtparam=poe_fan_temp2=3000,poe_fan_temp2_hyst=500\ndtparam=poe_fan_temp3=55000,poe_fan_temp3_hyst=5000\n"
# 256 MB boot — all Pi DTBs/overlays overflow 128 MB.
BOOT_SPACE = "262144"
